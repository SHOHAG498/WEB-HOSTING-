<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - SR Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">SR Shop</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Products</a>
        </nav>
    </header>

    <main class="container">
        <a href="index.html" class="back-link">&larr; Back to Shop</a>
        
        <div class="details-box">
            <div class="details-img" id="product-icon">📦</div>
            <div class="details-info">
                <h1 id="product-title">Product Details</h1>
                <p class="price" id="product-price">$00.00</p>
                <p class="desc">This is a premium quality product. Made with high durability and modern features to satisfy your daily needs.</p>
                
                <div class="buy-box">
                    <button class="btn buy-btn" onclick="alert('Item added to cart!')">Buy Now</button>
                </div>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
