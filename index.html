<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Web AR Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>AR Store</h1>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="container">
        <h2>Featured Products</h2>
        <div class="product-grid">
            <!-- Product Card 1 -->
            <div class="product-card">
                <div class="product-img-placeholder">3D Model</div>
                <h3>AR Sneaker Pro</h3>
                <p class="price">$99.00</p>
                <div class="btn-group">
                    <a href="ar.html?product=sneaker" class="btn ar-btn">View in AR</a>
                    <button class="btn buy-btn">Add to Cart</button>
                </div>
            </div>

            <!-- Product Card 2 -->
            <div class="product-card">
                <div class="product-img-placeholder">3D Model</div>
                <h3>AR Smart Watch</h3>
                <p class="price">$149.00</p>
                <div class="btn-group">
                    <a href="ar.html?product=watch" class="btn ar-btn">View in AR</a>
                    <button class="btn buy-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
