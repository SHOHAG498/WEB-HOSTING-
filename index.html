<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Web AR Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AR Viewport / Container -->
    <div id="ar-viewport">
        <div class="scanner-overlay">
            <div class="scan-box"></div>
            <p>Point camera at target marker</p>
        </div>
    </div>

    <!-- Professional UI Bottom Panel -->
    <div class="ui-panel">
        <h2>Web AR Portal</h2>
        <p>Experience immersive augmented reality directly in your browser.</p>
        <button id="ar-btn" class="pro-btn">Launch Experience</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
